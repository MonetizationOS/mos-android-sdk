# On main, opens or updates the "chore: release mos-android-sdk" PR from the pending changesets and dispatches CI on its
# branch, since a PR opened with GITHUB_TOKEN starts no workflows. Merging that PR bumps the version; this then runs the
# tests, uploads both libraries to Maven Central, signed, and makes the tag (v0.9.1) and a GitHub release from the
# CHANGELOG section. Central publishes nothing until someone presses Publish on the deployment in the Central Portal,
# because a published version can never be replaced. scripts/release-version.sh decides: an untagged version is released
# by any run once an earlier release is tagged, and the first release only by running this by hand. A failed upload
# makes no tag, so the next run retries it. The Maven secrets are listed in CONTRIBUTING.md.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  changesets:
    # workflow_dispatch can name any branch; only main releases.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.changesets.outputs.pullRequestNumber }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Before changesets/action, which leaves the release PR's branch checked out.
      - id: release
        run: scripts/release-version.sh "$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          title: "chore: release mos-android-sdk"
          commit: "chore: release mos-android-sdk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # CI on the release PR's branch, once changesets/action has created or updated the PR. A workflow_dispatch made with
  # GITHUB_TOKEN starts a run, unlike its pushes and PRs. A job of its own, so a failed dispatch never holds back a
  # release.
  release-pr-ci:
    needs: changesets
    if: needs.changesets.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}
  release:
    needs: changesets
    if: github.ref == 'refs/heads/main' && needs.changesets.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      TAG: v${{ needs.changesets.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-version.sh "$TAG"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew :mos-core:test :mos-android:testDebugUnitTest publishToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - run: |
          awk -v v="## ${TAG#v}" '$0 == v { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
