name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow dispatches this on the release PR's branch, since a PR it opens starts no workflows.
  workflow_dispatch:
jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-version.sh
  # fixtures/ and the web paywall files are copies of the iOS SDK's; this fails while they differ, and is skipped
  # with a warning while that repository is private and no SHARED_REPO_TOKEN is set.
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-shared.sh
        env:
          SHARED_REPO_TOKEN: ${{ secrets.SHARED_REPO_TOKEN }}
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The runner's preinstalled Android SDK (ANDROID_HOME is set), so mos-android is included.
      - run: ./gradlew :mos-core:test --no-daemon
      - run: ./gradlew :mos-android:testDebugUnitTest :mos-android:assembleRelease --no-daemon
      # The public API must match the dumps in mos-core/api and mos-android/api; updateKotlinAbi and apiDump record a change.
      - run: ./gradlew :mos-core:checkKotlinAbi :mos-android:apiCheck --no-daemon
      - run: ./gradlew publishToMavenLocal --no-daemon
  showcase:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Examples/Showcase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # AGP downloads a missing platform itself.
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
